<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#E8542E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- connecting lines from center to each outer user -->
  <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="6">
    <line x1="256" y1="256" x2="256" y2="146"/>
    <line x1="256" y1="256" x2="356" y2="204"/>
    <line x1="256" y1="256" x2="356" y2="312"/>
    <line x1="256" y1="256" x2="256" y2="370"/>
    <line x1="256" y1="256" x2="156" y2="204"/>
  </g>

  <!-- reusable user icon: head + shoulders -->
  <g id="user-icon-def">
    <circle cx="0" cy="-11" r="11" fill="#FFFFFF"/>
    <path d="M -18 20 C -18 4, -8 -3, 0 -3 C 8 -3, 18 4, 18 20 Z" fill="#FFFFFF"/>
  </g>

  <!-- five family members around the circle -->
  <use href="#user-icon-def" x="256" y="128" transform="scale(1)"/>
  <g transform="translate(356,192)"><use href="#user-icon-def"/></g>
  <g transform="translate(356,300)"><use href="#user-icon-def"/></g>
  <g transform="translate(256,358)"><use href="#user-icon-def"/></g>
  <g transform="translate(156,192)"><use href="#user-icon-def"/></g>

  <!-- center: caring hand cradling the person needing care -->
  <circle cx="256" cy="256" r="58" fill="#FFFFFF"/>
  <g transform="translate(256,256)">
    <!-- small figure being cared for -->
    <circle cx="0" cy="-16" r="10" fill="#E8542E"/>
    <path d="M -14 14 C -14 0, -6 -6, 0 -6 C 6 -6, 14 0, 14 14 Z" fill="#E8542E"/>
    <!-- cradling hand/arc beneath -->
    <path d="M -26 18 C -26 30, -14 38, 0 38 C 14 38, 26 30, 26 18"
          fill="none" stroke="#E8542E" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
